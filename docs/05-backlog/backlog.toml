# Backlog Rejoltance — JEDYNE źródło prawdy dla Jiry.
# Edytuj tutaj, potem: python tools/backlog/gen_jira_csv.py   (walidacja: --check)
# Format: TOML (parser w bibliotece standardowej Pythona 3.11+). Instrukcja: docs/05-backlog/README.md
#
# Fale (linia cięcia): W0 fundament · W1 MVP gry (semestr 1) · W2 pełna gra (semestr 2) · W3 dodatki (jeśli starczy czasu)
# Story bez [[...task]] ma pole estimate_h (szacunek do refinementu); taski max 4 h.
# Po imporcie wpisz klucz Jira w polu jira = "REJ-123", żeby kolejny import nie zdublował zgłoszeń.

[meta]
project_key = "REJ"
team_size = 6
hours_per_person_week = 5
buffer = 0.10
estimate_format = "seconds"   # seconds | jira ("4h") — ustal po testowym imporcie (docs/05-backlog/test-import)

[[sprint]]
id = "S0"
start = "2026-10-27"
end = "2026-11-02"
weeks = 1
goal = "Zespół pracuje w jednym repo i Jirze; DIP gotowy; spór o reguły rozstrzygnięty."

[[sprint]]
id = "S1"
start = "2026-11-03"
end = "2026-11-16"
weeks = 2
goal = "Dwie przeglądarki wchodzą do jednego pokoju i rozgrywają mulligan, wybór kolejności i start rundy."

[[sprint]]
id = "S2"
start = "2026-11-17"
end = "2026-11-30"
weeks = 2
goal = "Gracze zagrywają jednostki w krokach rundy, serwer odrzuca nielegalne ruchy."

[[sprint]]
id = "S3"
start = "2026-12-01"
end = "2026-12-14"
weeks = 2
goal = "Walka 4 linii rozstrzyga się do końca meczu; można zagrać z prostym botem."

[[sprint]]
id = "S4"
start = "2026-12-15"
end = "2027-01-11"
weeks = 2           # 4 tygodnie kalendarzowe, ale przerwa świąteczna — liczymy 2 tygodnie pracy
goal = "Słowa kluczowe walki działają; lobby z pokojami; baza PostgreSQL w Aspire."

[[sprint]]
id = "S5"
start = "2027-01-12"
end = "2027-01-25"
weeks = 2
goal = "Grywalne MVP z 12 kartami online i z botem, wdrożone pod publicznym adresem."

# Semestr 2 — sprinty bez dat (planowane po semestrze 1). Story tutaj leżą poniżej linii cięcia semestru 1.
[[sprint]]
id = "S6"
weeks = 2
semester = 2
goal = "Semestr 2 — pierwszy sprint (pełna pula kart, mocniejszy bot, replay)."

[[sprint]]
id = "S7"
weeks = 2
semester = 2
goal = "Semestr 2 — dodatki (obserwator, ranking, balans)."

