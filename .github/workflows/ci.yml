name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENSPEC_TELEMETRY: "0"

jobs:
  app:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint (incl. module boundaries and engine determinism)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (engine, content, server over Socket.IO, web)
        run: npm test
      - name: Build web client
        run: npm run build

  repo:
    name: Specs, docs, agents, content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: OpenSpec, markdown, agent adapters, card data, backlog, Confluence tree
        run: npm run check
