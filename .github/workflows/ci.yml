name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENSPEC_TELEMETRY: "0"

jobs:
  app:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint (incl. module boundaries and engine determinism)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (engine, content, server over Socket.IO, web)
        run: npm test
      - name: Build web client
        run: npm run build

  repo:
    name: Specs, docs, agents, content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - name: OpenSpec validate
        run: npm run spec:validate
      - name: Markdown lint
        run: npm run lint:md
      - name: Agent adapters are in sync with .agents/
        run: python tools/agents/sync_agents.py --check
      - name: Card data matches the prototype
        run: python tools/content/extract_cards.py --check
      - name: Backlog is valid and Jira CSV up to date
        run: python tools/backlog/gen_jira_csv.py --check
      - name: Confluence 1:1 documentation tree and links are valid
        run: python tools/confluence/sync_confluence.py --check
