name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  OPENSPEC_TELEMETRY: "0"

jobs:
  dotnet:
    name: .NET build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Restore
        run: dotnet restore Rejoltance.slnx
      - name: Format check
        run: dotnet format Rejoltance.slnx --verify-no-changes --no-restore
      - name: Build (warnings as errors)
        run: dotnet build Rejoltance.slnx --no-restore -c Release -p:CI=true
      - name: Unit, architecture and server tests
        run: dotnet test Rejoltance.slnx --no-build -c Release --filter "Category!=Integration" --logger "trx" --results-directory TestResults
      - name: Install web deps (needed by the AppHost web resource)
        run: npm ci --prefix src/web
      - name: AppHost smoke test (whole app starts, /health OK)
        run: dotnet test tests/Rejoltance.AppHost.Tests --no-build -c Release --logger "trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: TestResults

  web:
    name: Web lint, typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  repo:
    name: Specs, docs, agents, content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - name: OpenSpec validate
        run: npm run spec:validate
      - name: Markdown lint
        run: npm run lint:md
      - name: Agent adapters are in sync with .agents/
        run: python tools/agents/sync_agents.py --check
      - name: Card data matches the prototype
        run: python tools/content/extract_cards.py --check
      - name: Backlog is valid
        run: |
          if [ -f tools/backlog/gen_jira_csv.py ]; then python tools/backlog/gen_jira_csv.py --check; fi
